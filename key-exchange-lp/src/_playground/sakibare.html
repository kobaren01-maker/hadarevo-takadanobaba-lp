<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- 遊び用。本番LPには含めない・検索エンジンに載せない -->
<meta name="robots" content="noindex, nofollow" />
<title>先バレ演出（遊び）｜鍵マッハ24</title>
<!-- 「おめでとう」用の極太フォント（使う文字だけ読み込む） -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&text=%E3%81%8A%E3%82%81%E3%81%A7%E3%81%A8%E3%81%86&display=swap" />
<style>
  :root {
    --red: #c4001a;
    --blood: #6b000d;
    --skin: #e9e2dc;
    --skin-shade: #b9aea6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }

  /* 背景：本物のLPをそのまま表示し、その上に演出を重ねる */
  .lp { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }

  .stage {
    position: fixed;
    inset: 0;
    z-index: 10;
    overflow: hidden;
    pointer-events: none;
  }
  .stage.is-active { pointer-events: auto; }

  /* ---------- スタート画面（音を鳴らすにはタップが必要） ---------- */
  .start {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: grid;
    place-items: center;
    background: rgba(0, 0, 0, 0.75);
    color: #fff;
    border: 0;
    font: inherit;
    cursor: pointer;
  }
  .start__inner { text-align: center; }
  .start__title { font-size: 22px; font-weight: 700; letter-spacing: 0.1em; }
  .start__sub { margin-top: 8px; font-size: 13px; opacity: 0.7; }
  .start__btn {
    display: inline-block;
    margin-top: 24px;
    padding: 14px 32px;
    border: 2px solid var(--red);
    color: #fff;
    border-radius: 999px;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 50% { box-shadow: 0 0 24px var(--red); } }

  /* ---------- 暗転・赤いチラつき ---------- */
  .dim {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 40%, rgba(80, 0, 10, 0.55), rgba(0, 0, 0, 0.95) 70%);
    opacity: 0;
    transition: opacity 0.25s;
  }
  .stage.is-dim .dim { opacity: 1; }
  .stage.is-flicker .dim { animation: flicker 0.6s steps(2) 1; }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    20% { opacity: 0.3; background-color: var(--blood); }
    40% { opacity: 1; }
    60% { opacity: 0.5; background-color: var(--red); }
  }

  /* ---------- 手（上から落ちてくる。爪側をこちらに向けてつかみかかる形） ---------- */
  .hand {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(118vw, 560px);
    /* 待機中は画面の上の外に置く（素材画像は横長なので、高さ基準ではなく画面の高さ分ずらす） */
    transform: translate(-50%, calc(-50% - 100vh)) rotate(-10deg) scale(0.8);
    height: auto;
    filter: drop-shadow(0 24px 30px rgba(0, 0, 0, 0.7));
  }
  .stage.is-drop .hand { animation: drop 0.45s cubic-bezier(0.6, 0, 1, 0.5) forwards; }
  @keyframes drop {
    to { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
  }
  /* 着地で一瞬つぶれて跳ね返る → 少し止まってから手前に抜けて消える */
  .stage.is-landed .hand {
    transform: translate(-50%, -50%) scale(1);
    animation: squash 0.3s ease-out, hand-out 0.45s 1.05s ease-in forwards;
  }
  @keyframes squash {
    0% { transform: translate(-50%, -46%) scale(1.06, 0.92); }
    60% { transform: translate(-50%, -52%) scale(0.98, 1.03); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }
  @keyframes hand-out {
    to { transform: translate(-50%, -50%) scale(1.7); opacity: 0; filter: blur(8px); }
  }

  /* 着地の瞬間の背景：赤〜マゼンタの爆発＋黄色い中心＋集中線 */
  .rush {
    position: absolute;
    inset: -20%;
    background: radial-gradient(circle at 50% 52%, #fff7c2 0%, #ffd23a 7%, #ff6a1a 16%, #ff1650 30%, #c4006b 48%, #4a0030 72%, #12000b 90%);
    opacity: 0;
  }
  .rush::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-conic-gradient(from 3deg at 50% 52%, rgba(255, 255, 255, 0.55) 0deg 0.8deg, transparent 0.8deg 6deg);
    -webkit-mask: radial-gradient(circle at 50% 52%, transparent 18%, #000 60%);
            mask: radial-gradient(circle at 50% 52%, transparent 18%, #000 60%);
    animation: lines 0.25s steps(3) infinite;
  }
  @keyframes lines { 50% { transform: rotate(2deg) scale(1.03); } }
  .stage.is-landed .rush { opacity: 1; animation: rush-in 0.35s ease-out; }
  .stage.is-win .rush { opacity: 0; transition: opacity 0.4s; }
  @keyframes rush-in { from { transform: scale(1.4); opacity: 0.4; } }

  /* 着地の衝撃：画面揺れ・赤フラッシュ・衝撃波 */
  .stage.is-landed { animation: shake 0.45s linear 1; }
  @keyframes shake {
    10% { transform: translate(-10px, 6px); }
    20% { transform: translate(9px, -8px); }
    30% { transform: translate(-7px, -4px); }
    40% { transform: translate(6px, 8px); }
    55% { transform: translate(-4px, 3px); }
    70% { transform: translate(3px, -2px); }
    100% { transform: none; }
  }
  .flash { position: absolute; inset: 0; background: var(--red); opacity: 0; mix-blend-mode: screen; }
  .stage.is-landed .flash { animation: flash 0.5s ease-out 1; }
  @keyframes flash { 0% { opacity: 0.9; } 100% { opacity: 0; } }

  .wave {
    position: absolute;
    left: 50%;
    top: 52%;
    width: 40px;
    height: 40px;
    margin: -20px 0 0 -20px;
    border: 6px solid var(--red);
    border-radius: 50%;
    opacity: 0;
  }
  .stage.is-landed .wave { animation: wave 0.7s ease-out 1; }
  .stage.is-landed .wave--2 { animation-delay: 0.12s; }
  @keyframes wave {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(18); border-width: 1px; }
  }

  /* ---------- 当たり：回転する光線 ---------- */
  .burst {
    position: absolute;
    left: 50%;
    top: 42%;
    width: 220vmax;
    height: 220vmax;
    margin: -110vmax 0 0 -110vmax;
    background: repeating-conic-gradient(
      from 0deg,
      rgba(255, 40, 90, 0.55) 0deg 5deg, rgba(255, 190, 0, 0.55) 5deg 10deg,
      rgba(255, 255, 120, 0.55) 10deg 15deg, rgba(60, 255, 120, 0.5) 15deg 20deg,
      rgba(40, 200, 255, 0.55) 20deg 25deg, rgba(170, 60, 255, 0.55) 25deg 30deg
    );
    -webkit-mask: radial-gradient(circle, #000 0%, rgba(0, 0, 0, 0.6) 22%, transparent 48%);
            mask: radial-gradient(circle, #000 0%, rgba(0, 0, 0, 0.6) 22%, transparent 48%);
    opacity: 0;
  }
  .stage.is-win .dim { background: radial-gradient(circle at 50% 40%, rgba(70, 0, 40, 0.9), rgba(0, 0, 0, 0.97) 72%); }
  .stage.is-win .burst { opacity: 1; transition: opacity 0.3s; animation: spin 4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 白ストロボ（確定の瞬間に3連） */
  .strobe { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 6; pointer-events: none; }
  .stage.is-win .strobe { animation: strobe 0.55s linear 1; }
  @keyframes strobe {
    0% { opacity: 1; } 14% { opacity: 0; } 28% { opacity: 0.9; } 42% { opacity: 0; } 58% { opacity: 0.75; } 100% { opacity: 0; }
  }

  /* 虹枠：画面のふちを虹色の光が流れ続ける＝当たり確定 */
  @property --ang { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
  .rframe {
    position: absolute;
    inset: 0;
    z-index: 5;
    padding: 12px;
    background: conic-gradient(from var(--ang), #ff0040, #ff9a00, #fff200, #30ff00, #00e5ff, #2a5cff, #c400ff, #ff0040);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    filter: drop-shadow(0 0 6px #fff) drop-shadow(0 0 18px rgba(255, 255, 255, 0.8));
    opacity: 0;
    pointer-events: none;
  }
  .rframe-glow {
    position: absolute;
    inset: 0;
    z-index: 5;
    box-shadow: inset 0 0 40px 14px rgba(255, 60, 200, 0.55), inset 0 0 90px 30px rgba(255, 255, 255, 0.18);
    opacity: 0;
    pointer-events: none;
  }
  .stage.is-win .rframe { opacity: 1; animation: ang 1s linear infinite, frame-in 0.35s ease-out; }
  .stage.is-win .rframe-glow { opacity: 1; animation: glow-hue 1.2s linear infinite; }
  @keyframes ang { to { --ang: 360deg; } }
  @keyframes frame-in { from { transform: scale(1.12); opacity: 0; } }
  @keyframes glow-hue { to { filter: hue-rotate(360deg); } }

  /* キラキラ（canvasで描画） */
  .sparkle { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 7; pointer-events: none; }

  /* 文字が叩きつけられるたびの小さな揺れ */
  .stage.is-hit { animation: hit 0.16s linear 1; }
  @keyframes hit { 30% { transform: translate(4px, -5px); } 60% { transform: translate(-4px, 4px); } }

  /* ---------- キャラクター＋吹き出し ---------- */
  .chara {
    position: absolute;
    left: 50%;
    bottom: 0;
    z-index: 4;
    width: min(80vw, 380px);
    transform: translate(-50%, 110%);
  }
  .chara::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 40%;
    width: 150%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255, 236, 140, 0.95) 0%, rgba(255, 150, 40, 0.6) 25%, rgba(255, 0, 120, 0.25) 45%, transparent 65%);
    z-index: -1;
    animation: aura 0.9s ease-in-out infinite alternate;
  }
  @keyframes aura { to { transform: translate(-50%, -50%) scale(1.12); opacity: 0.75; } }
  .stage.is-chara .chara { transition: transform 0.5s cubic-bezier(0.2, 1.3, 0.4, 1); transform: translate(-50%, 0); }
  /* クーポンが出たら左下へ小さく下がり、クーポンを渡している位置に */
  .stage.is-coupon .chara {
    transition: transform 0.4s ease, left 0.4s ease, width 0.4s ease;
    left: 0;
    width: min(38vw, 170px);
    transform: translate(-6%, 0);
  }
  .chara img { display: block; width: 100%; height: auto; }

  .bubble {
    position: absolute;
    left: 50%;
    top: 11%;
    z-index: 8;
    transform: translateX(-50%);
    width: 100%;
    text-align: center;
    pointer-events: none;
  }
  .bubble__name {
    display: inline-block;
    padding: 3px 14px;
    font-size: 14px;
    font-weight: 900;
    color: #fff;
    background: linear-gradient(180deg, #ff2d4a, #a3001a);
    border: 2px solid #ffe27a;
    border-radius: 6px;
    letter-spacing: 0.12em;
    box-shadow: 0 0 14px rgba(255, 220, 100, 0.9);
    transform: scale(0);
  }
  .stage.is-chara .bubble__name { transition: transform 0.35s cubic-bezier(0.2, 1.8, 0.4, 1); transform: scale(1); }

  /* 虹色メタリック立体文字の「おめでとう」 */
  .rainbow {
    margin: 4px 0 0;
    font-family: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
    font-size: clamp(54px, 16.5vw, 116px);
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }
  .rainbow span {
    display: inline-block;
    color: transparent;
    background-image:
      linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, 0.95) 50%, transparent 62%),
      linear-gradient(180deg, #ffffff 0%, #fff7a0 16%, #ffb12e 34%, #ff2a72 52%, #b43cff 72%, #3fd8ff 100%);
    background-size: 260% 100%, 100% 100%;
    background-position: 160% 0, 0 0;
    -webkit-background-clip: text;
            background-clip: text;
    -webkit-text-stroke: 1.5px #fff;
    filter: drop-shadow(0 3px 0 #ffcf3a) drop-shadow(0 4px 0 #6a0f86) drop-shadow(0 0 14px rgba(255, 70, 200, 0.95));
    opacity: 0;
    transform: scale(3.4);
  }
  .rainbow span.on {
    opacity: 1;
    transform: none;
    animation:
      slam 0.32s cubic-bezier(0.3, 0, 0.3, 1) both,
      shine 1.6s linear 0.5s infinite,
      hue 2.4s linear 0.5s infinite,
      hop 1s ease-in-out 0.5s infinite;
  }
  @keyframes slam {
    0% { opacity: 0; transform: scale(3.4); filter: blur(6px) drop-shadow(0 0 0 #fff); }
    55% { opacity: 1; transform: scale(0.82); }
    78% { transform: scale(1.12); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes shine { to { background-position: -60% 0, 0 0; } }
  @keyframes hue {
    to { filter: hue-rotate(360deg) drop-shadow(0 3px 0 #ffcf3a) drop-shadow(0 4px 0 #6a0f86) drop-shadow(0 0 14px rgba(255, 70, 200, 0.95)); }
  }
  @keyframes hop { 50% { translate: 0 -7px; } }

  /* ---------- クーポン ---------- */
  .coupon {
    position: absolute;
    left: 50%;
    top: 31%;
    width: min(80vw, 340px);
    padding: 14px 14px 12px;
    background: linear-gradient(135deg, #fff9e6, #ffe7a3);
    border: 3px dashed #c48a00;
    border-radius: 14px;
    text-align: center;
    color: #3a2a00;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 220, 120, 0.6);
    transform: translateX(-50%) rotateY(90deg);
    opacity: 0;
  }
  .coupon { z-index: 9; overflow: hidden; }
  .coupon::after {
    content: "";
    position: absolute;
    inset: -50% auto -50% -60%;
    width: 40%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.85), transparent);
    transform: rotate(20deg);
    animation: coupon-shine 2.2s ease-in-out 0.6s infinite;
    pointer-events: none;
  }
  @keyframes coupon-shine { 0% { left: -60%; } 60%, 100% { left: 130%; } }
  .stage.is-coupon .coupon { animation: coupon-glow 1s ease-in-out infinite alternate; }
  @keyframes coupon-glow {
    from { box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 24px rgba(255, 220, 120, 0.7); }
    to { box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 46px rgba(255, 230, 140, 1), 0 0 90px rgba(255, 120, 200, 0.6); }
  }
  .stage.is-coupon .coupon {
    transition: transform 0.5s cubic-bezier(0.2, 1.3, 0.4, 1), opacity 0.2s;
    transform: translateX(-50%) rotateY(0);
    opacity: 1;
  }
  .coupon p { margin: 0; }
  .coupon__label { font-size: 13px; font-weight: 700; letter-spacing: 0.2em; }
  .coupon__off { font-size: 56px; font-weight: 900; line-height: 1.1; color: var(--red); }
  .coupon__off small { font-size: 22px; }
  .coupon__code {
    display: inline-block;
    margin-top: 6px;
    padding: 4px 12px;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.15em;
    background: #fff;
    border-radius: 6px;
  }
  .coupon__note { margin-top: 8px; font-size: 11px; opacity: 0.75; }
  .coupon__actions { display: grid; gap: 8px; margin-top: 14px; }
  .coupon__actions a,
  .coupon__actions button {
    display: block;
    padding: 12px;
    border: 0;
    border-radius: 10px;
    font: inherit;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
  }
  .btn-tel { background: #e8590c; color: #fff; }
  .btn-sub { background: rgba(0, 0, 0, 0.08); color: #3a2a00; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<!-- 背景：本番LPの骨組みをそのまま読み込む -->
<iframe class="lp" src="/" title="鍵マッハ24 LP"></iframe>

<div class="stage" id="stage" aria-live="polite">
  <div class="dim"></div>
  <div class="burst"></div>

  <div class="rush"></div>
  <div class="wave"></div>
  <div class="wave wave--2"></div>

  <!-- 手：hand.webp（背景透過の素材画像） -->
  <img class="hand" src="hand.webp" alt="" width="1000" height="702" />

  <div class="flash"></div>

  <div class="chara">
    <img src="kaneki.webp" alt="" width="790" height="800" onerror="this.parentNode.hidden = true;" />
  </div>

  <div class="bubble">
    <span class="bubble__name">金木くん</span>
    <p class="rainbow" id="rainbow"></p>
  </div>

  <canvas class="sparkle" id="sparkle"></canvas>
  <div class="rframe-glow"></div>
  <div class="rframe"></div>
  <div class="strobe"></div>

  <div class="coupon" role="dialog" aria-label="10%オフクーポン">
    <p class="coupon__label">WEB限定クーポン</p>
    <p class="coupon__off">10<small>%OFF</small></p>
    <span class="coupon__code" id="coupon-code">MACH-10</span>
    <p class="coupon__note">お電話の際に「WEBクーポン」とお伝えください<br />※遊び用のデモです。実際の割引ではありません</p>
    <div class="coupon__actions">
      <a class="btn-tel" href="tel:07091861366">クーポンを使って電話する</a>
      <button class="btn-sub" type="button" id="again">もう一回</button>
      <button class="btn-sub" type="button" id="close">閉じる</button>
    </div>
  </div>
</div>

<button class="start" id="start" type="button">
  <span class="start__inner">
    <span class="start__title">運試し</span><br />
    <span class="start__sub">音が出ます</span><br />
    <span class="start__btn">▶ タップでスタート</span>
  </span>
</button>

<script>
(function () {
  "use strict";

  var stage = document.getElementById("stage");

  // 遊び用：背景のLPのFVをバナー画像1枚に差し替える（本番LPのファイルは変更しない）
  // バナーに見出し・料金・強みが入っているので、LP側の見出し等は隠し、電話・LINEボタンだけ残す
  var lp = document.querySelector(".lp");
  var fvImage = new URL("fv-banner.webp", location.href).href;
  function swapFv() {
    var doc;
    try { doc = lp.contentDocument; } catch (e) { return; }
    var fv = doc && doc.querySelector(".fv");
    if (!fv || fv.dataset.swapped) return;
    fv.dataset.swapped = "1";
    Array.prototype.forEach.call(fv.children, function (el) {
      if (!el.classList.contains("btn")) el.style.display = "none";
    });
    var img = doc.createElement("img");
    img.src = fvImage;
    img.alt = "鍵マッハ24 鍵のトラブルにすぐ駆けつけます 24時間365日受付中";
    img.width = 1491;
    img.height = 1055;
    // 画面の端まで広げて表示（FVの左右余白を打ち消す）
    img.style.cssText = "display:block;width:calc(100% + 32px);max-width:none;height:auto;margin:0 -16px 4px;";
    fv.style.paddingTop = "0";
    fv.prepend(img);
  }
  lp.addEventListener("load", swapFv);
  swapFv();
  var startBtn = document.getElementById("start");
  var rainbow = document.getElementById("rainbow");
  var audio = null;

  // 「おめでとう」を1文字ずつ叩きつける（JSで順番に .on を付ける）
  var chars = "おめでとう".split("").map(function (ch, i) {
    var s = document.createElement("span");
    s.textContent = ch;
    s.style.animationDelay = "0s, " + (0.5 + i * 0.08) + "s, 0.5s, " + i * 0.12 + "s";
    rainbow.appendChild(s);
    return s;
  });

  // ---------- キラキラ（canvas） ----------
  var cv = document.getElementById("sparkle");
  var ctx = cv.getContext("2d");
  var parts = [];
  var running = false;
  var emitTwinkle = false;
  var emitConfetti = false;
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = innerWidth * dpr;
    cv.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  addEventListener("resize", resize);

  var GOLD = ["#fff8c4", "#ffe066", "#ffffff", "#ffd1f0", "#b8f3ff"];
  var CONFETTI = ["#ff2a6d", "#ffd400", "#29f0ff", "#9b5cff", "#3dff8a", "#ffffff"];
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function pick(a) { return a[(Math.random() * a.length) | 0]; }

  function burst(x, y, n, speed) {
    for (var i = 0; i < n; i++) {
      var ang = rnd(0, Math.PI * 2), v = rnd(speed * 0.3, speed);
      parts.push({ t: "star", x: x, y: y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v, life: 0, max: rnd(40, 80), size: rnd(4, 11), c: pick(GOLD), g: 0.05 });
    }
  }
  function twinkle() {
    var w = innerWidth, h = innerHeight, x, y;
    if (Math.random() < 0.6) { // 虹枠のふち
      var side = (Math.random() * 4) | 0;
      x = side === 0 ? rnd(0, 24) : side === 1 ? rnd(w - 24, w) : rnd(0, w);
      y = side === 2 ? rnd(0, 24) : side === 3 ? rnd(h - 24, h) : rnd(0, h);
    } else { // 「おめでとう」のまわり
      x = rnd(w * 0.05, w * 0.95); y = rnd(h * 0.08, h * 0.3);
    }
    parts.push({ t: "star", x: x, y: y, vx: 0, vy: 0, life: 0, max: rnd(18, 34), size: rnd(5, 13), c: pick(GOLD), g: 0 });
  }
  function confetti() {
    parts.push({ t: "paper", x: rnd(0, innerWidth), y: -10, vx: rnd(-0.6, 0.6), vy: rnd(1.5, 3.2), life: 0, max: 400, size: rnd(5, 9), c: pick(CONFETTI), r: rnd(0, 6.28), vr: rnd(-0.2, 0.2) });
  }
  function drawStar(p) {
    var k = p.life / p.max, a = k < 0.2 ? k / 0.2 : 1 - (k - 0.2) / 0.8;
    var r = p.size * (0.6 + 0.6 * Math.sin(k * Math.PI));
    ctx.globalAlpha = Math.max(0, a);
    ctx.fillStyle = p.c;
    ctx.beginPath(); // 4方向に尖ったキラ
    ctx.moveTo(p.x, p.y - r * 2);
    ctx.quadraticCurveTo(p.x, p.y, p.x + r * 2, p.y);
    ctx.quadraticCurveTo(p.x, p.y, p.x, p.y + r * 2);
    ctx.quadraticCurveTo(p.x, p.y, p.x - r * 2, p.y);
    ctx.quadraticCurveTo(p.x, p.y, p.x, p.y - r * 2);
    ctx.fill();
    ctx.globalAlpha = Math.max(0, a) * 0.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, r * 0.9, 0, 6.28); ctx.fill();
  }
  function drawPaper(p) {
    ctx.globalAlpha = 1;
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.r);
    ctx.scale(1, Math.abs(Math.cos(p.life * 0.12)) + 0.15); // ひらひら
    ctx.fillStyle = p.c;
    ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66);
    ctx.restore();
  }
  function tick() {
    if (!running) { ctx.clearRect(0, 0, innerWidth, innerHeight); return; }
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    if (emitTwinkle) for (var i = 0; i < 3; i++) twinkle();
    if (emitConfetti) for (var j = 0; j < 3; j++) confetti();
    ctx.globalCompositeOperation = "lighter";
    parts = parts.filter(function (p) {
      p.life++; p.x += p.vx; p.y += p.vy; p.vy += p.g || 0;
      if (p.t === "star") { p.vx *= 0.96; p.vy *= 0.96; drawStar(p); }
      return p.life < p.max && p.y < innerHeight + 20;
    });
    ctx.globalCompositeOperation = "source-over";
    parts.forEach(function (p) { if (p.t === "paper") { p.r += p.vr; drawPaper(p); } });
    requestAnimationFrame(tick);
  }
  function startFx() {
    if (reduceMotion) return;
    parts = []; running = true; emitTwinkle = true;
    requestAnimationFrame(tick);
  }
  function stopFx() { running = false; emitTwinkle = false; emitConfetti = false; parts = []; }

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  // ---------- 効果音（音源ファイルなし。WebAudioで合成） ----------
  function tone(type, f1, f2, start, dur, vol) {
    var t = audio.currentTime + start;
    var o = audio.createOscillator();
    var g = audio.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(audio.destination);
    o.start(t);
    o.stop(t + dur);
  }
  function noise(start, dur, vol) {
    var len = audio.sampleRate * dur;
    var buf = audio.createBuffer(1, len, audio.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = audio.createBufferSource();
    var g = audio.createGain();
    var t = audio.currentTime + start;
    src.buffer = buf;
    g.gain.setValueAtTime(vol, t);
    src.connect(g).connect(audio.destination);
    src.start(t);
  }
  var fallBuffer = null;
  function loadFall() {
    if (!audio) return;
    fetch(new URL("fall.mp3", location.href))
      .then(function (r) { return r.arrayBuffer(); })
      .then(function (b) { return audio.decodeAudioData(b); })
      .then(function (buf) { fallBuffer = buf; })
      .catch(function () { fallBuffer = null; });
  }
  function playFall() {
    if (!audio) return;
    if (!fallBuffer) { sfx.don(); return; }
    var src = audio.createBufferSource();
    src.buffer = fallBuffer;
    src.connect(audio.destination);
    src.start();
  }

  // 金管っぽい和音（ノコギリ波をローパスで丸める）
  function brass(freqs, start, dur, vol) {
    var t = audio.currentTime + start;
    var f = audio.createBiquadFilter();
    var g = audio.createGain();
    f.type = "lowpass"; f.frequency.value = 2600;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.03);
    g.gain.setValueAtTime(vol, t + dur * 0.7);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    f.connect(g).connect(audio.destination);
    freqs.forEach(function (fr) {
      [-6, 6].forEach(function (det) {
        var o = audio.createOscillator();
        o.type = "sawtooth"; o.frequency.value = fr; o.detune.value = det;
        o.connect(f); o.start(t); o.stop(t + dur);
      });
    });
  }

  var sfx = {
    kyuin: function () { if (!audio) return; tone("sawtooth", 300, 2400, 0, 0.5, 0.12); tone("square", 600, 4800, 0.05, 0.45, 0.05); },
    don:   function () { if (!audio) return; tone("sine", 140, 30, 0, 0.6, 0.9); noise(0, 0.35, 0.5); },
    // 確定音：長いキュイーン＋鐘＋キラキラ
    kakutei: function () {
      if (!audio) return;
      tone("sawtooth", 500, 3600, 0, 0.3, 0.16);
      tone("square", 1000, 7200, 0, 0.3, 0.06);
      tone("sawtooth", 3600, 3500, 0.3, 0.9, 0.1);
      [2093, 2637, 3136, 4186].forEach(function (f, i) { tone("sine", f, f, 0.05 + i * 0.02, 1.6, 0.12); });
      for (var i = 0; i < 26; i++) tone("sine", 2400 + Math.random() * 3600, 6000, 0.3 + i * 0.05, 0.12, 0.05);
    },
    // 文字が叩きつけられる音
    hit: function (i) {
      if (!audio) return;
      tone("sine", 200, 50, 0, 0.22, 0.7);
      noise(0, 0.08, 0.25);
      tone("triangle", 1047 * Math.pow(1.122, i), 1047 * Math.pow(1.122, i), 0, 0.25, 0.14);
    },
    // ファンファーレ：駆け上がり→長い和音
    fanfare: function () {
      if (!audio) return;
      [523, 659, 784, 1047].forEach(function (f, i) { brass([f], i * 0.1, 0.16, 0.12); });
      brass([523, 659, 784, 1047], 0.42, 1.6, 0.11);
      brass([262], 0.42, 1.6, 0.12);
      for (var i = 0; i < 18; i++) tone("sine", 3000 + Math.random() * 3000, 6500, 0.5 + i * 0.07, 0.1, 0.04);
    },
    coupon: function () {
      if (!audio) return;
      [1568, 2093, 2637, 3136].forEach(function (f, i) { tone("sine", f, f, i * 0.06, 0.6, 0.1); });
    }
  };

  var playId = 0;
  function reset() {
    playId++;
    stage.className = "stage";
    chars.forEach(function (c) { c.classList.remove("on"); });
    stopFx();
  }

  // ---------- 演出の流れ ----------
  async function play() {
    reset();
    var id = playId;
    var alive = function () { return id === playId; };
    void stage.offsetWidth; // アニメーションを最初から再生させる
    stage.classList.add("is-active", "is-dim", "is-flicker");
    sfx.kyuin();
    await wait(700); if (!alive()) return;

    stage.classList.add("is-drop");      // 手が落ちる（落下音は元音声の14秒〜。衝撃音が約0.3秒後に来る）
    playFall();
    await wait(450); if (!alive()) return;
    stage.classList.remove("is-drop");
    stage.classList.add("is-landed");    // 着地：揺れ・赤フラッシュ
    await wait(1500); if (!alive()) return;

    // 確定：白ストロボ3連 → 虹枠 → 中央からキラキラ爆発
    stage.classList.add("is-win");
    sfx.kakutei();
    startFx();
    burst(innerWidth / 2, innerHeight * 0.4, 140, 14);
    await wait(650); if (!alive()) return;

    // 「おめでとう」を1文字ずつ叩きつける
    for (var i = 0; i < chars.length; i++) {
      chars[i].classList.add("on");
      sfx.hit(i);
      var r = chars[i].getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2, 26, 7);
      stage.classList.remove("is-hit"); void stage.offsetWidth; stage.classList.add("is-hit");
      await wait(150); if (!alive()) return;
    }

    // キャラ登場＋ファンファーレ＋紙吹雪
    stage.classList.add("is-chara");
    sfx.fanfare();
    emitConfetti = true;
    burst(innerWidth / 2, innerHeight * 0.75, 80, 10);
    await wait(1500); if (!alive()) return;

    // クーポン
    stage.classList.add("is-coupon");
    sfx.coupon();
    burst(innerWidth / 2, innerHeight * 0.5, 90, 11);
  }

  startBtn.addEventListener("click", function () {
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
    startBtn.remove();
    loadFall();
    setTimeout(play, 300); // 落下音の読み込みを待つ
  });
  document.getElementById("again").addEventListener("click", play);
  document.getElementById("close").addEventListener("click", reset);
})();
</script>
</body>
</html>
