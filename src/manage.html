<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ご予約の確認・変更｜肌REVO 高田馬場店</title>
<meta name="robots" content="noindex" />
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<section class="section manage" data-manage-app>
  <h1 class="heading">ご予約の確認・変更</h1>

  <div class="manage__status" data-manage-status>ご予約を確認しています…</div>

  <div class="manage__current" data-manage-current hidden>
    <p class="manage__label">現在のご予約</p>
    <p class="manage__datetime" data-manage-datetime>-</p>

    <div class="manage__actions" data-manage-actions>
      <button type="button" class="cta-button" data-manage-reschedule>日時を変更する</button>
      <button type="button" class="manage__cancel-link" data-manage-cancel>この予約をキャンセルする</button>
    </div>

    <p class="manage__deadline-note" data-manage-deadline-note hidden>
      ご来店前日を過ぎているため、このページからの変更・キャンセルはできません。お電話にてご連絡ください。
    </p>
  </div>

  <div class="reserve__slots" data-manage-slots hidden></div>

  <p class="manage__result" data-manage-result hidden></p>
</section>

<script src="script.js"></script>
</body>
</html>
