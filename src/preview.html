<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>プレビュー｜肌REVO 高田馬場店 LP</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
    background: #e9e4da;
    min-height: 100vh;
  }
  .bar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: #2b2a28;
    color: #fff;
    flex-wrap: wrap;
  }
  .bar button, .bar a {
    font: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.35);
    background: transparent;
    color: #fff;
    cursor: pointer;
    text-decoration: none;
  }
  .bar button.is-active {
    background: #fff;
    color: #2b2a28;
  }
  .bar .spacer { flex: 1; }
  .stage {
    display: flex;
    justify-content: center;
    padding: 40px 12px 60px;
  }
  .frame {
    width: 375px;
    height: 812px;
    border: 10px solid #1c1c1c;
    border-radius: 40px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
  }
  .frame.is-tablet { width: 768px; height: 900px; border-radius: 20px; }
  .frame.is-desktop { width: 100%; max-width: 1100px; height: 900px; border-radius: 8px; }
  .frame iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }
</style>
</head>
<body>

<div class="bar">
  <button type="button" data-page="index.html" class="is-active">LP本体</button>
  <button type="button" data-page="manage.html?t=preview">予約管理ページ</button>
  <span class="spacer"></span>
  <button type="button" data-size="mobile" class="is-active">スマホ幅</button>
  <button type="button" data-size="tablet">タブレット幅</button>
  <button type="button" data-size="desktop">PC幅</button>
  <a href="index.html" target="_blank" rel="noopener">別タブで開く ↗</a>
</div>

<div class="stage">
  <div class="frame" data-frame>
    <iframe data-preview-iframe src="index.html" title="LPプレビュー"></iframe>
  </div>
</div>

<script>
  const frame = document.querySelector("[data-frame]");
  const iframe = document.querySelector("[data-preview-iframe]");

  document.querySelectorAll("[data-page]").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("[data-page]").forEach((b) => b.classList.remove("is-active"));
      btn.classList.add("is-active");
      iframe.src = btn.dataset.page;
    });
  });

  document.querySelectorAll("[data-size]").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("[data-size]").forEach((b) => b.classList.remove("is-active"));
      btn.classList.add("is-active");
      frame.classList.remove("is-tablet", "is-desktop");
      if (btn.dataset.size === "tablet") frame.classList.add("is-tablet");
      if (btn.dataset.size === "desktop") frame.classList.add("is-desktop");
    });
  });
</script>

</body>
</html>
